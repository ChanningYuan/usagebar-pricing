name: sync-pricing
on:
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = 北京时间 03:00，赶在 usagebar.cn 服务器 04:37 拉取之前
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch models.dev and slim
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 180 -o /tmp/full.json https://models.dev/api.json
          python3 slim.py /tmp/full.json pricing.json
      - name: commit if changed
        run: |
          git add pricing.json
          if ! git diff --cached --quiet; then
            git config user.name 'pricing-bot'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "sync $(date -u +%F)"
            git push
          fi
